# Checks every pull request and push to main; the long end-to-end suite runs nightly and on demand.
# GitHub Actions is free for public repositories. Third-party actions are pinned by commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Check, integration tests, web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongo:
        # MongoDB 8.0.34 refuses to start on the runners' Linux 6.19+ kernel (SERVER-121912, OPERATIONS
        # 13.2); 7.0 is not affected. Return to the bundled 8.0.x once a fixed 8.0 image is published.
        image: mongo:7.0.45
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.10
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version is the same in package.json, deploy/.env.example and CHANGELOG.md
        run: node scripts/release.mjs check
      - name: Lint, typecheck, unit tests, licences
        run: pnpm check
      - name: Integration tests (MongoDB and Valkey)
        run: pnpm --filter @gachipad/api --filter @gachipad/collab --filter @gachipad/storage test
      - name: Web build
        run: pnpm --filter @gachipad/web build
      - name: Deploy script tests
        run: |
          bash deploy/security-scripts.test.sh
          bash deploy/network.test.sh
          bash deploy/preflight.test.sh
          bash deploy/update.test.sh
          bash deploy/rename.test.sh
          bash deploy/migrate-db.test.sh
          bash deploy/verify-lib.test.sh

  e2e:
    name: End-to-end (Playwright, ${{ matrix.browser }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # One runner per engine: the whole suite on one runner took 38-60 minutes and hit the limit.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    timeout-minutes: 45
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
    services:
      mongo:
        # MongoDB 8.0.34 refuses to start on the runners' Linux 6.19+ kernel (SERVER-121912, OPERATIONS
        # 13.2); 7.0 is not affected. Return to the bundled 8.0.x once a fixed 8.0 image is published.
        image: mongo:7.0.45
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.10
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gachipad/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @gachipad/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: .box-out/playwright
          retention-days: 7

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (MIT)
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  windows-deploy:
    name: Windows installer scripts (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # The PowerShell Gallery fails a download now and then (11 Nov); try three times.
          function Install-WithRetry([hashtable] $Module) {
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module @Module -Scope CurrentUser -Force -ErrorAction Stop; return }
              catch { if ($i -eq 3) { throw }; Write-Warning $_; Start-Sleep -Seconds (15 * $i) }
            }
          }
          Install-WithRetry @{ Name = 'Pester'; RequiredVersion = '5.7.1' }
          Install-WithRetry @{ Name = 'PSScriptAnalyzer' }
      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path ./deploy/windows-tests -Output Detailed -CI
      - name: Pester (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          for ($i = 1; $i -le 3; $i++) {
            try {
              Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              break
            } catch { if ($i -eq 3) { throw }; Write-Warning $_; Start-Sleep -Seconds (15 * $i) }
          }
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./deploy/windows-tests -Output Detailed -CI
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./deploy -Recurse
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) { exit 1 }
